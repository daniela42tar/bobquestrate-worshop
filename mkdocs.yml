site_name: Bobchestrate Workshop
site_description: Hands-on workshop for building AI agents with IBM watsonx Orchestrate
site_author: Workshop Team
repo_url: https://github.ibm.com/Daniela-Tarzia/bobquestrate-worshop
edit_uri: ""
# Documentation directory
docs_dir: docs

# Repository
repo_name: bobchestrate-workshop


# Theme configuration
theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation structure
nav:
  - Home: index.md
  - Introduction: introduction.md
  - Part 1 - Setup: part1-setup/README.md
  - Part 2 - First Agent: part2-first-agent/README.md
  - Part 3 - Bob Custom Rules: part3-bob-custom-rules/README.md
  - Part 4 - Multi-Agent Orchestration: part4-multi-agent-orchestration/README.md
  - Bob Prompts: bob-prompts/helpful-prompts.md

# Plugins
plugins:
  - search
  - glightbox

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/bobchestrate-workshop



# Made with Bob
