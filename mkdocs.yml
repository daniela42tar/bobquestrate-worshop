site_name: Bobchestrate Workshop
site_description: Hands-on workshop for building AI agents with IBM watsonx Orchestrate
site_author: Workshop Team
repo_url: https://github.ibm.com/Daniela-Tarzia/bobquestrate-worshop
edit_uri: ""
# Documentation directory
docs_dir: docs

# Repository
repo_name: bobchestrate-workshop


# Theme configuration
theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    # Dark mode (default, first palette entry with no media query)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

# Navigation structure
nav:
  - Home: index.md
  - Introduction: introduction.md
  - Part 1 - Setup: part1-setup/README.md
  - Part 2 - First Agent: part2-first-agent/README.md
  - Part 3 - Custom Tools: part3-custom-tools/README.md
  - Part 4 - Multi-Agent Orchestration: part4-multi-agent-orchestration/README.md
  - Bob Prompts: bob-prompts/helpful-prompts.md
  # English translations
  - en/Home: en/index.md
  - en/Introduction: en/introduction.md
  - en/Part 1 - Setup: en/part1-setup/README.md
  - en/Part 2 - First Agent: en/part2-first-agent/README.md
  - en/Part 3 - Custom Tools: en/part3-custom-tools/README.md
  - en/Part 4 - Multi-Agent Orchestration: en/part4-multi-agent-orchestration/README.md
  - en/Bob Prompts: en/bob-prompts/helpful-prompts.md
  # Catalan translations
  - ca/Home: ca/index.md
  - ca/Introduction: ca/introduction.md
  - ca/Part 1 - Setup: ca/part1-setup/README.md
  - ca/Part 2 - First Agent: ca/part2-first-agent/README.md
  - ca/Part 3 - Custom Tools: ca/part3-custom-tools/README.md
  - ca/Part 4 - Multi-Agent Orchestration: ca/part4-multi-agent-orchestration/README.md
  - ca/Bob Prompts: ca/bob-prompts/helpful-prompts.md

# Plugins
plugins:
  - search
  - glightbox

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Custom JS
extra_javascript:
  - javascripts/lang-switcher.js

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/bobchestrate-workshop



# Made with Bob
